<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FindYourVoice</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'&gt;&lt;path d='M128,176a48.05,48.05,0,0,0,48-48V64a48,48,0,0,0-96,0v64A48.05,48.05,0,0,0,128,176ZM96,64a32,32,0,0,1,64,0v64a32,32,0,0,1-64,0ZM216,128a8,8,0,0,1-16,0,72.08,72.08,0,0,0-72-72v24a8,8,0,0,1-16,0V56a72.08,72.08,0,0,0-72,72,8,8,0,0,1-16,0,88.1,88.1,0,0,1,88-87.64V24a8,8,0,0,1,16,0V40.36A88.1,88.1,0,0,1,216,128ZM128,248a8,8,0,0,1-8-8v-24.36A88.1,88.1,0,0,1,40,128a8,8,0,0,1,16,0,72.08,72.08,0,0,0,72,72v24a8,8,0,0,1-16,0V144a72.08,72.08,0,0,0-72-72,8,8,0,0,1-16,0,88.1,88.1,0,0,1,88,87.64V240A8,8,0,0,1,128,248Z' fill='%23234E70'/&gt;&lt;/svg&gt;">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .hover-underline:hover { text-decoration: underline !important; }
    </style>
    <script>
        if (localStorage.getItem('dir') === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
        }
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>
</head>

<body class="bg-light auth-page">

    <section class="min-vh-100 d-flex align-items-md-center align-items-start justify-content-center position-relative pt-5 pt-md-0">
        
        <!-- Top Right Icons -->
        <div class="position-absolute top-0 end-0 p-4 m-2 d-flex align-items-center gap-2 z-3">
            <button class="btn btn-outline-secondary border border-2 d-flex align-items-center justify-content-center p-2 rounded-circle mx-1" style="width: 40px; height: 40px;" id="theme-toggle" aria-label="Toggle Dark Mode"><i class="ph ph-moon fs-5"></i></button>
            <button class="btn btn-outline-secondary border border-2 d-flex align-items-center justify-content-center p-2 rounded-circle mx-1" style="width: 40px; height: 40px;" id="rtl-toggle" aria-label="Toggle RTL"><i class="ph ph-arrows-left-right fs-5"></i></button>
        </div>

        <div class="w-100 max-w-500 fade-up bg-white p-5 rounded-4 shadow-sm border border-light mt-5 mt-md-0 pt-4 pt-md-5" style="max-width: 450px;">
            <div class="mb-5 text-center">
                <a class="navbar-brand d-flex align-items-center justify-content-center text-decoration-none fs-3 fw-black text-primary mb-2" href="index.html">
                    <i class="ph-fill ph-microphone-stage text-primary me-2"></i>FindYourVoice.
                </a>
                <p class="text-muted mb-0">Welcome back! Please login to your account.</p>
            </div>

            <form action="parent-dashboard.html" method="GET">
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="position-relative">
                        <i class="ph-bold ph-envelope-simple position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                        <input type="email" class="form-control form-control-lg bg-light border-0 ps-5" id="email"
                            placeholder="parent@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="position-relative">
                        <i class="ph-bold ph-lock-key position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                        <input type="password" class="form-control form-control-lg bg-light border-0 ps-5 pe-5"
                            id="password" placeholder="••••••••" required>
                        <button type="button"
                            class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-muted px-3"
                            aria-label="Toggle password visibility">
                            <i class="ph-bold ph-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom btn-premium w-100 mb-3">Login</button>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check mb-0">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="small text-primary text-decoration-none hover-underline">Forgot password?</a>
                </div>

                <div class="d-flex align-items-center mb-4">
                    <hr class="flex-grow-1 opacity-25">
                    <span class="mx-3 text-muted small">OR</span>
                    <hr class="flex-grow-1 opacity-25">
                </div>

                <div class="d-flex flex-column gap-2 mb-4">
                    <button type="button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2">
                        <i class="ph-fill ph-google-logo fs-5"></i> Continue with Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2">
                        <i class="ph-fill ph-facebook-logo fs-5 text-primary"></i> Continue with Facebook
                    </button>
                    <button type="button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2">
                        <i class="ph-fill ph-apple-logo fs-5 text-dark"></i> Continue with Apple
                    </button>
                </div>

                <p class="text-center text-muted mb-0">
                    Don't have an account? <a href="signup.html"
                        class="text-primary fw-bold text-decoration-none hover-underline">Signup</a>
                </p>
            </form>
        </div>
    </section>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
